[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patient-handout-maker"
version = "0.1.0"
description = "Nurse-educator CLI that drafts plain-language patient teaching handouts (education only, never medical advice)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Asdale Dynamics, LLC" },
]
requires-python = ">=3.9"
keywords = ["nursing", "patient-education", "handouts", "healthcare", "cli", "llm", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
handout = "patient_handout_maker.cli:main"

[tool.setuptools.packages.find]
include = ["patient_handout_maker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
